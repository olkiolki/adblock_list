# 本仓库的规则源清单。
# 由 GitHub Actions 定时抓取、去重、转换格式后发布到 release 分支。
# 修改此文件会触发一次重新生成。

adfs:
  input:
    # ---- AdGuard 官方规则（AdGuard 语法）----
    - name: AdGuard 基础过滤器
      path: https://raw.githubusercontent.com/AdguardTeam/FiltersRegistry/master/filters/filter_2_Base/filter.txt
      type: adblock
      dialect: adguard

    - name: AdGuard 移动广告过滤器
      path: https://raw.githubusercontent.com/AdguardTeam/FiltersRegistry/master/filters/filter_11_Mobile/filter.txt
      type: adblock
      dialect: adguard

    - name: AdGuard 防跟踪保护
      path: https://raw.githubusercontent.com/AdguardTeam/FiltersRegistry/master/filters/filter_3_Spyware/filter.txt
      type: adblock
      dialect: adguard

    - name: AdGuard URL 跟踪参数
      path: https://raw.githubusercontent.com/AdguardTeam/FiltersRegistry/master/filters/filter_17_TrackParam/filter.txt
      type: adblock
      dialect: adguard

    - name: AdGuard 社交媒体
      path: https://raw.githubusercontent.com/AdguardTeam/FiltersRegistry/master/filters/filter_4_Social/filter.txt
      type: adblock
      dialect: adguard

    - name: AdGuard 恼人元素
      path: https://raw.githubusercontent.com/AdguardTeam/FiltersRegistry/master/filters/filter_14_Annoyances/filter.txt
      type: adblock
      dialect: adguard

    - name: AdGuard 解除搜索广告
      path: https://raw.githubusercontent.com/AdguardTeam/FiltersRegistry/master/filters/filter_10_Useful/filter.txt
      type: adblock
      dialect: adguard

    - name: AdGuard 中文过滤器
      path: https://raw.githubusercontent.com/AdguardTeam/FiltersRegistry/master/filters/filter_224_Chinese/filter.txt
      type: adblock
      dialect: adguard

    # ---- 第三方规则 ----
    - name: 秋风广告规则
      path: https://raw.githubusercontent.com/TG-Twilight/AWAvenue-Adblock-Rule/main/Filters/AWAvenue-Ads-Rule-Adguard.txt
      type: adblock
      dialect: adguard

    - name: halflife-list
      path: https://raw.githubusercontent.com/sbwml/halflife-list/master/ad-pc.txt
      type: adblock
      dialect: ubo

    - name: 10007 保留广告奖励
      path: https://raw.githubusercontent.com/lingeringsound/10007_auto/master/adb.txt
      type: adblock
      dialect: ubo

    # ---- hosts 类来源 ----
    - name: 大圣净化
      path: https://raw.githubusercontent.com/jdlingyu/ad-wars/master/hosts
      type: hosts

    - name: 1024_hosts
      path: https://raw.githubusercontent.com/Goooler/1024_hosts/master/hosts
      type: hosts

    - name: AdAway 默认清单
      path: https://adaway.org/hosts.txt
      type: hosts

    - name: WindowsSpyBlocker
      path: https://raw.githubusercontent.com/crazy-max/WindowsSpyBlocker/master/data/hosts/spy.txt
      type: hosts

    - name: neoHosts
      path: https://cdn.jsdelivr.net/gh/neoFelhz/neohosts@gh-pages/full/hosts.txt
      type: hosts

    # ---- 纯域名类来源 ----
    - name: oisd small
      path: https://small.oisd.nl
      type: dns
      dialect: adguard

    # ---- 本仓库手工维护的补充规则 ----
    # 注意：不得放在输出目录 rule/ 内，否则配置校验会报错。
    - name: 本仓库私有规则
      path: inputs/private.txt
      type: adblock
      dialect: ubo

  output:
    # 通用过滤器：uBlock Origin / AdGuard / AdBlock Plus
    - name: adblock.txt
      type: adblock
      dialect: ubo

    # AdGuard Home / 基于 DNS 的过滤
    - name: dns.txt
      type: dns
      dialect: adguard

    # AdAway / 系统 hosts / 路由器
    - name: hosts.txt
      type: hosts

    # 路由器插件
    - name: dnsmasq.txt
      type: dnsmasq

    - name: smartdns.txt
      type: smartdns

    # Clash / mihomo 规则集
    - name: clash.yaml
      type: mihomo
      dialect: domain
      container: yaml

    # sing-box 规则集（JSON 输出不写文件头）
    - name: sing-box.json
      type: sing-box
      container: json

  config:
    output-dir: rule
    file-header: |
      Title: AdBlock List - {{name}}
      Total Size: {{total}}
      Last Modified: {{date}}
      Homepage: https://github.com/olkiolki/adblock_list
      Source: https://github.com/fordes123/ad-filters-subscriber
