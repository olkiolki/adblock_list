# 本仓库的规则源清单。
# 由 GitHub Actions 定时抓取、去重、转换格式后发布到 release 分支。
# 修改此文件会触发一次重新生成。
#
# 类型说明：
#   dns     —— 仅域名级规则（||example.com^ 或纯域名），转换损耗最小
#   adblock —— 含修饰符、元素隐藏等完整过滤语法
#   hosts   —— 0.0.0.0 / ::1 形式的 hosts 文件

adfs:
  input:
    # ===== AdGuard 官方 =====
    - name: AdGuard Base filter
      path: https://raw.githubusercontent.com/AdguardTeam/FiltersRegistry/master/filters/filter_2_Base/filter.txt
      type: adblock
      dialect: adguard

    - name: AdGuard Chinese filter
      path: https://raw.githubusercontent.com/AdguardTeam/FiltersRegistry/master/filters/filter_224_Chinese/filter.txt
      type: adblock
      dialect: adguard

    - name: AdGuard Mobile Ads filter
      path: https://raw.githubusercontent.com/AdguardTeam/AdguardFilters/master/MobileFilter/sections/adservers.txt
      type: dns
      dialect: adguard

    - name: AdGuard DNS filter
      path: https://adguardteam.github.io/AdGuardSDNSFilter/Filters/filter.txt
      type: dns
      dialect: adguard

    # ===== EasyList 系列（ABP 原生语法）=====
    - name: EasyList
      path: https://easylist-downloads.adblockplus.org/easylist.txt
      type: adblock
      dialect: abp

    - name: EasyList China
      path: https://easylist-downloads.adblockplus.org/easylistchina.txt
      type: adblock
      dialect: abp

    - name: EasyPrivacy
      path: https://easylist-downloads.adblockplus.org/easyprivacy.txt
      type: adblock
      dialect: abp

    - name: CJX's Annoyance List
      path: https://raw.githubusercontent.com/cjx82630/cjxlist/master/cjx-annoyance.txt
      type: adblock
      dialect: abp

    # ===== 其他过滤规则 =====
    # AdRules 含 /正则/ 规则，必须按 adblock 解析，否则正则会丢失
    - name: AdRules DNS List
      path: https://raw.githubusercontent.com/Cats-Team/AdRules/main/dns.txt
      type: adblock
      dialect: adguard

    # mv.txt 含 ## 元素隐藏与 $script,domain= 修饰符，需要 ubo 方言
    - name: xinggsf mv filter
      path: https://raw.githubusercontent.com/xinggsf/Adblock-Plus-Rule/master/mv.txt
      type: adblock
      dialect: ubo

    - name: jiekouAD
      path: https://raw.githubusercontent.com/damengzhu/banad/main/jiekouAD.txt
      type: dns
      dialect: adguard

    # ===== DNS 清单 =====
    - name: AWAvenue Ads Rule
      path: https://raw.githubusercontent.com/TG-Twilight/AWAvenue-Ads-Rule/main/AWAvenue-Ads-Rule.txt
      type: dns
      dialect: adguard

    - name: DNS-Blocklists PRO mini
      path: https://raw.githubusercontent.com/hagezi/dns-blocklists/main/adblock/pro.mini.txt
      type: dns
      dialect: adguard

    - name: OISD Basic
      path: https://abp.oisd.nl/basic/
      type: dns
      dialect: adguard

    # ===== hosts 清单 =====
    - name: StevenBlack hosts
      path: https://raw.githubusercontent.com/StevenBlack/hosts/master/hosts
      type: hosts

    - name: Pollock hosts
      path: https://someonewhocares.org/hosts/hosts
      type: hosts

    # ===== 本仓库手工维护的补充规则 =====
    # 注意：不同语法必须分文件声明，混在一起会导致规则被静默丢弃。
    # 且不得放在输出目录 rule/ 内，否则配置校验会报错。
    - name: 本仓库私有规则（adblock）
      path: inputs/private-adblock.txt
      type: adblock
      dialect: ubo

    - name: 本仓库私有规则（hosts）
      path: inputs/private-hosts.txt
      type: hosts

  output:
    # 通用过滤器：uBlock Origin / AdGuard / AdBlock Plus
    - name: adblock.txt
      type: adblock
      dialect: ubo

    # AdGuard Home / 基于 DNS 的过滤
    - name: dns.txt
      type: dns
      dialect: adguard

    # AdAway / 系统 hosts / 路由器
    - name: hosts.txt
      type: hosts

    # 路由器插件
    - name: dnsmasq.txt
      type: dnsmasq

    - name: smartdns.txt
      type: smartdns

    # Clash / mihomo 规则集
    - name: clash.yaml
      type: mihomo
      dialect: domain
      container: yaml

    # sing-box 规则集（JSON 输出不写文件头）
    - name: sing-box.json
      type: sing-box
      container: json

  config:
    output-dir: rule
    file-header: |
      Title: AdBlock List - {{name}}
      Total Size: {{total}}
      Last Modified: {{date}}
      Homepage: https://github.com/olkiolki/adblock_list
      Source: https://github.com/fordes123/ad-filters-subscriber
